<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Provenance Passport · Kigali Balance</title>
  <meta name="description" content="Trace a cylinder of HFC refrigerant back to the registered equipment it was recovered from. Simulated data, plus live reads from OP Sepolia.">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" href="assets/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
<main class="page">
  <section class="intro" aria-labelledby="page-title">
    <p class="crumb"><span class="badge">Simulated data</span><span>Live lots are read from OP Sepolia</span></p>
    <h1 id="page-title">Provenance passport</h1>
    <p class="lede">Look up a cylinder lot to see which registered equipment its gas came from, which rules the ledger checked, and where the gas is now. Every line is a signed ledger record, not something the seller declared.</p>

    <form class="lookup" id="search" novalidate>
      <label for="lot-input">Lot number</label>
      <div class="lookup-row">
        <input class="field" id="lot-input" inputmode="numeric" autocomplete="off" placeholder="e.g. 42" aria-describedby="lot-hint">
        <select class="field" id="source" aria-label="Data source">
          <option value="sim">Simulated market</option>
          <option value="chain">Live on OP Sepolia</option>
        </select>
        <button class="btn" type="submit">Look up</button>
      </div>
      <p class="hint" id="lot-hint" role="alert"></p>
      <p class="examples" id="examples"></p>
    </form>
  </section>

  <div id="out" aria-live="polite"></div>
</main>
<script type="module" src="assets/passport.js"></script>
</body>
</html>
