# Outside judge: on every push, a fresh GitHub-hosted Linux machine rebuilds everything from scratch
# (contracts + invariants, simulator, differential replay against the contracts, AI modules, web data,
# diagrams, problem-statement PDF) and fails if any committed file does not reproduce byte for byte.
name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.5

      # Carlito has Calibri's exact metrics, so the PDFs lay out (and paginate) as on Windows
      - name: Fonts for the PDFs
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-crosextra-carlito fonts-liberation

      - name: Rebuild everything and check it reproduces
        run: bash scripts/ci_check.sh

      - name: Keep the measured numbers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rebuild-latest
          path: reports/rebuild-latest.json
          if-no-files-found: ignore

  # Second outside judge: Slither static analysis. Fails on any Medium or High finding; the Low and
  # Informational ones are triaged in docs/security/static-analysis.md.
  static-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.5

      - name: Slither (fail on Medium or above)
        run: |
          pip install slither-analyzer==0.11.6
          slither . --fail-medium
