[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
fs_permissions = [{ access = "read-write", path = "./reports" }, { access = "read-write", path = "./deployments" }]

# Values come from .env (see .env.example); they are only resolved when a command uses them.
[rpc_endpoints]
op_sepolia = "${OP_SEPOLIA_RPC_URL}"
sepolia = "${SEPOLIA_RPC_URL}"

[etherscan]
op_sepolia = { key = "${ETHERSCAN_API_KEY}", chain = 11155420 }
sepolia = { key = "${ETHERSCAN_API_KEY}" }

[fuzz]
runs = 512

[invariant]
runs = 128
depth = 64
fail_on_revert = false

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
