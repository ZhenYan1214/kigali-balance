<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 644" width="820" height="644" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif">
<title id="t">Pathway 1 sensitivity: which assumption drives the estimate</title>
<desc id="d">Tornado chart of Pathway 1 for a market the size of Japan's, avoided emissions attributable to verifiable recovery in MtCO2e per year. Headline (destroyed share only) with every input at its median: 0.063. Headline: destroyed share only: p5 0.011, p50 0.057, p95 0.177; Upper: reclaimed gas displaces virgin: p5 0.024, p50 0.132, p95 0.406. Δr  recovery-rate increase: 0.017 to 0.136; α  share attributable to verifiability: 0.019 to 0.117; φ  permanence of extra recovery: 0.063 to 0.144; GWP of the extra recovered gas: 0.061 to 0.063; M  gas left in scrapped equipment: 0.062 to 0.063.</desc>
<rect width="820" height="644" fill="#1a1a19"/>
<text x="24" y="36" font-size="19" font-weight="600" fill="#f0efec">Two assumptions and one accounting choice set the answer</text>
<text x="24" y="60" font-size="13" fill="#c3c2b7">Pathway 1 for a market the size of Japan’s (MOEJ 2024 flows used as a unit conversion) · Mt CO₂e per year (AR4 GWP)</text>
<text x="24" y="78" font-size="13" fill="#c3c2b7">Not an estimate for Japan, where α ≈ 0 · each bar moves one input, others at their median · not a forecast</text>
