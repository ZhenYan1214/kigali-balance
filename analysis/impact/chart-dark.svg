<text x="376.8" y="501.5" font-size="12" fill="#c3c2b7" text-anchor="start" stroke="#1a1a19" stroke-width="5" stroke-linejoin="round" paint-order="stroke">0.062–0.063 · input 12,011 t to 12,066 t</text>
<text x="24" y="582" font-size="11.5" fill="#c3c2b7">Δr and α are assumed triangular distributions; the Monte Carlo propagates them, it does not reduce them. Rank correlation: Δr 0.75, α 0.61.</text>
<text x="24" y="598" font-size="11.5" fill="#c3c2b7">GWP and M move only within the narrow ranges the MOEJ slide supports. A pilot would measure Δr × α directly. Pathways 1 and 2 must not be added.</text>
<text x="24" y="614" font-size="11.5" fill="#c3c2b7">Sources: MOEJ, OEWG48 side-event deck, Jul 2026; JRAIA decks 2012–2025; Carbon Containment Lab, Jun 2024; EIA, May 2026.</text>
</svg>
