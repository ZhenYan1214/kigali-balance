<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 520" width="820" height="520" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif">
<title id="t">Laundering capacity at decommissioning, by defence layer</title>
<desc id="d">Virgin gas that could be booked as recovered if every one of the 1,856 registered units were padded to the limit, in tonnes CO2e. Honest recovered volume is 86,168 t. 0  No ledger: no bound; 1  Lifetime cap only: 323,452 t; 2  + per-recovery cap only: 323,452 t; 2′ + booked content per unit: 38,564 t; 3  + padding detector: 30,013 t</desc>
<rect width="820" height="520" fill="#1a1a19"/>
<text x="24" y="36" font-size="19" font-weight="600" fill="#f0efec">How much virgin gas could be booked as “recovered”?</text>
<text x="24" y="60" font-size="13" fill="#c3c2b7">Capacity if all 1,856 registered units (simulator register) were padded to the limit at end of life · t CO₂e (AR4 GWP)</text>
<text x="24" y="78" font-size="13" fill="#c3c2b7">True remaining charge drawn from IPCC 2006 Table 7.9 ranges · mean of 400 draws · one assumption set (see report for sensitivity)</text>
<rect x="300" y="90" width="12" height="12" rx="2" fill="#3987e5"/>
<text x="318" y="100" font-size="12" fill="#c3c2b7">Tier A (national registry)</text>
<rect x="500" y="90" width="12" height="12" rx="2" fill="#d95926"/>
<text x="518" y="100" font-size="12" fill="#c3c2b7">Tier B (registered at scrapping)</text>
<line x1="300.0" y1="134" x2="300.0" y2="404" stroke="#33332f" stroke-width="1"/>
<text x="300.0" y="422" font-size="11" fill="#c3c2b7" text-anchor="middle">0k</text>
<line x1="373.7" y1="134" x2="373.7" y2="404" stroke="#33332f" stroke-width="1"/>
<text x="373.7" y="422" font-size="11" fill="#c3c2b7" text-anchor="middle">50k</text>
<line x1="447.4" y1="134" x2="447.4" y2="404" stroke="#33332f" stroke-width="1"/>
<text x="447.4" y="422" font-size="11" fill="#c3c2b7" text-anchor="middle">100k</text>
<line x1="521.2" y1="134" x2="521.2" y2="404" stroke="#33332f" stroke-width="1"/>
<text x="521.2" y="422" font-size="11" fill="#c3c2b7" text-anchor="middle">150k</text>
<line x1="594.9" y1="134" x2="594.9" y2="404" stroke="#33332f" stroke-width="1"/>
<text x="594.9" y="422" font-size="11" fill="#c3c2b7" text-anchor="middle">200k</text>
<line x1="668.6" y1="134" x2="668.6" y2="404" stroke="#33332f" stroke-width="1"/>
<text x="668.6" y="422" font-size="11" fill="#c3c2b7" text-anchor="middle">250k</text>
<line x1="742.3" y1="134" x2="742.3" y2="404" stroke="#33332f" stroke-width="1"/>
<text x="742.3" y="422" font-size="11" fill="#c3c2b7" text-anchor="middle">300k</text>
<text x="796.0" y="438" font-size="11" fill="#c3c2b7" text-anchor="end">t CO₂e</text>
<line x1="427.1" y1="130" x2="427.1" y2="404" stroke="#c3c2b7" stroke-width="1.5"/>
<text x="427.1" y="124" font-size="11.5" fill="#c3c2b7" text-anchor="middle">honest recovered volume 86.2 kt</text>
<text x="24" y="160.0" font-size="13.5" font-weight="600" fill="#f0efec">0  No ledger</text>
<text x="24" y="177.0" font-size="11.5" fill="#c3c2b7">paper claims, no unit register</text>
<g><title>No ledger: no unit register and no one-claim-per-unit rule, so paper claims have no finite bound (phantom units, repeated claims).</title><rect x="300" y="150.0" width="482" height="22" rx="4" fill="#5e5d58" opacity="0.55"/><path d="M782,146.0 L798,161.0 L782,176.0 Z" fill="#5e5d58"/><text x="310" y="165.5" font-size="12.5" font-weight="600" fill="#f0efec">no finite bound</text></g>
<text x="24" y="214.0" font-size="13.5" font-weight="600" fill="#f0efec">1  Lifetime cap only</text>
<text x="24" y="231.0" font-size="11.5" fill="#c3c2b7">charge + recorded top-ups (before 16 Oct)</text>
<g><title>1  Lifetime cap only: 323,452 t CO2e (90 % of draws 309,396–338,020); Tier A 321,729 t, Tier B 1,723 t; 375% of honest recovered volume; 122,531 kg</title>
<rect x="300" y="204.0" width="474.4" height="22" rx="4" fill="#3987e5"/>
<rect x="776.4" y="204.0" width="1.0" height="22" rx="4" fill="#d95926"/>
<text x="766.9" y="219.5" font-size="12.5" fill="#ffffff" text-anchor="end"><tspan font-weight="600">323.5 kt</tspan>  · 375% of honest recovery</text></g>
<text x="24" y="268.0" font-size="13.5" font-weight="600" fill="#f0efec">2  + per-recovery cap only</text>
<text x="24" y="285.0" font-size="11.5" fill="#c3c2b7">bypassed by splitting (code of 16 Oct, replaced)</text>
<g><title>2  + per-recovery cap only: 323,452 t CO2e (90 % of draws 309,396–338,020); Tier A 321,729 t, Tier B 1,723 t; 375% of honest recovered volume; 122,531 kg</title>
<rect x="300" y="258.0" width="474.4" height="22" rx="4" fill="#3987e5"/>
<rect x="776.4" y="258.0" width="1.0" height="22" rx="4" fill="#d95926"/>
<text x="766.9" y="273.5" font-size="12.5" fill="#ffffff" text-anchor="end"><tspan font-weight="600">323.5 kt</tspan>  · 375% of honest recovery</text></g>
<text x="24" y="322.0" font-size="13.5" font-weight="600" fill="#f0efec">2′ + booked content per unit</text>
<text x="24" y="339.0" font-size="11.5" fill="#c3c2b7">implemented: recoveries draw it down, top-ups refill</text>
<g><title>2′ + booked content per unit: 38,564 t CO2e (90 % of draws 36,469–40,721); Tier A 36,841 t, Tier B 1,723 t; 45% of honest recovered volume; 13,708 kg</title>
<rect x="300" y="312.0" width="54.3" height="22" rx="4" fill="#3987e5"/>
<rect x="356.3" y="312.0" width="1.0" height="22" rx="4" fill="#d95926"/>
<text x="364.9" y="327.5" font-size="12.5" fill="#f0efec" stroke="#1a1a19" stroke-width="5" stroke-linejoin="round" paint-order="stroke"><tspan font-weight="600">38.6 kt</tspan><tspan fill="#c3c2b7">  · 45% of honest recovery</tspan></text></g>
<text x="24" y="376.0" font-size="13.5" font-weight="600" fill="#f0efec">3  + padding detector</text>
<text x="24" y="393.0" font-size="11.5" fill="#c3c2b7">proposed Tier A signal; module C for Tier B</text>
<g><title>3  + padding detector: 30,013 t CO2e (90 % of draws 28,476–31,659); Tier A 28,376 t, Tier B 1,637 t; 35% of honest recovered volume; 10,834 kg</title>
<rect x="300" y="366.0" width="41.8" height="22" rx="4" fill="#3987e5"/>
<rect x="343.8" y="366.0" width="1.0" height="22" rx="4" fill="#d95926"/>
<text x="352.3" y="381.5" font-size="12.5" fill="#f0efec" stroke="#1a1a19" stroke-width="5" stroke-linejoin="round" paint-order="stroke"><tspan font-weight="600">30.0 kt</tspan><tspan fill="#c3c2b7">  · 35% of honest recovery</tspan></text></g>
<text x="24" y="466" font-size="11.5" fill="#c3c2b7">Headroom = what the rules would accept minus what was really inside. Capacity, not an estimate of actual fraud.</text>
<text x="24" y="482" font-size="11.5" fill="#c3c2b7">Scenario 2 (code of 16 Oct, since replaced by 2′): a recovery without decommissioning could be repeated with no recorded charge in between,</text>
<text x="24" y="498" font-size="11.5" fill="#c3c2b7">so the lifetime cap is reached in several transactions. Off-ledger charges before recovery are invisible to all layers.</text>
</svg>